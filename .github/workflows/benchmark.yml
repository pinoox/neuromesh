name: Continuous Empirical Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly run
  workflow_dispatch:

jobs:
  benchmark:
    name: Gold eval (v0.9.0 fast engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (embeddings)
        run: cargo build --release --bin neuromesh --features embeddings

      - name: Gold-task evaluation
        run: |
          ./target/release/neuromesh eval | tee eval_output.txt

      - name: Release gates (informational)
        continue-on-error: true
        run: |
          ./target/release/neuromesh eval --release-gates | tee release_gates_output.txt

      - name: ANN SIMD benchmark (informational)
        continue-on-error: true
        run: |
          cargo bench -p neuromesh-graph ann_search -- --noplot | tee ann_bench_output.txt

      - name: Publish Benchmark Summary
        run: |
          echo "## Benchmark v0.9.0 — tiered retrieval engines" >> $GITHUB_STEP_SUMMARY
          echo "Commit \`${{ github.sha }}\` · release binary with \`--features embeddings\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Gold eval (\`neuromesh eval\`)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 eval_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f release_gates_output.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Release gates (informational — holdout matrix)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 30 release_gates_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f ann_bench_output.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ANN bench (\`cargo bench -p neuromesh-graph ann_search\`)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 20 ann_bench_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
