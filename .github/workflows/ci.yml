name: Continuous Integration & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test Suite & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch bundled MiniLM weights
        run: bash scripts/fetch-minilm-model.sh

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Automated Unit & Integration Tests
        run: cargo test --all --verbose

      - name: Embedding feature tests
        run: cargo test -p neuromesh-context --features embeddings --verbose

      - name: Embed crate unit tests
        run: cargo test -p neuromesh-embed --verbose

      - name: Graph proxy fixture tests
        run: cargo test -p neuromesh-graph-proxy --verbose

      - name: Release binary smoke (embed-primary)
        run: |
          cargo build --release -p neuromesh-cli --bin neuromesh --features embeddings
          ./target/release/neuromesh -V
          ./target/release/neuromesh doctor --embed
