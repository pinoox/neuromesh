[workspace]
resolver = "2"
members = [
    "crates/neuromesh-core",
    "crates/neuromesh-index",
    "crates/neuromesh-parser",
    "crates/neuromesh-graph",
    "crates/neuromesh-task",
    "crates/neuromesh-context",
    "crates/neuromesh-memory",
    "crates/neuromesh-cache",
    "crates/neuromesh-router",
    "crates/neuromesh-provider",
    "crates/neuromesh-api",
    "crates/neuromesh-mcp",
    "crates/neuromesh-local-ai",
    "crates/neuromesh-observability",
    "crates/neuromesh-cli",
]

[workspace.package]
version = "0.5.3"
edition = "2021"
rust-version = "1.80"
authors = ["NeuroMesh Team <team@neuromesh.local>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pinoox/neuromesh"

[workspace.dependencies]
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
futures-util = "0.3"
walkdir = "2.5"
thiserror = "2.0"
parking_lot = "0.12"
dirs = "6.0"
rayon = "1.11"
anyhow = "1.0"
