[package]
name = "neuromesh-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neuromesh-core = { path = "../neuromesh-core" }
neuromesh-index = { path = "../neuromesh-index" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
tracing.workspace = true
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"
tree-sitter-python = "0.23.6"
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-php = "0.23.11"
tree-sitter-kotlin-sg = "0.4.1"
# ABI 13–14 only (tree-sitter 0.24). Newer c-sharp/swift/dart crates ship ABI 15.
tree-sitter-ruby = "=0.23.1"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-dart-orchard = "0.6.0"
tree-sitter-swift = "=0.6.0"
